<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | SwiftSchool</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            color: #333;
        }

        header {
            background: #0b3d91;
            color: white;
            padding: 15px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-weight: bold;
        }

        .hero {
            height: 380px;
            background:
                linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                url("https://images.unsplash.com/photo-1560785496-3c9d27877182?auto=format&fit=crop&w=1600&q=80")
                center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 48px;
        }

        .section {
            padding: 70px 7%;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            transition: .3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media(max-width:900px) {
            .gallery {
                grid-template-columns: 1fr 1fr;
            }

            nav {
                display: none;
            }
        }

        @media(max-width:550px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SwiftSchool</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="academics.html">Academics</a>
        <a href="admissions.html">Admissions</a>
        <a href="staff.html">Staff</a>
        <a href="gallery.html">Gallery</a>
        <a href="news.html">News</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>School Gallery</h1>
        <p>A glimpse into life at SwiftSchool.</p>
    </div>
</section>

<section class="section">

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1000&q=80" alt="Classroom">

        <img src="https://images.unsplash.com/photo-1588072432836-e10032774350?auto=format&fit=crop&w=1000&q=80" alt="Students">

        <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=1000&q=80" alt="Students learning">

        <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1000&q=80" alt="School lesson">

        <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1000&q=80" alt="Teacher">

        <img src="https://images.unsplash.com/photo-1529390079861-591de354faf5?auto=format&fit=crop&w=1000&q=80" alt="Students together">

        <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1000&q=80" alt="School building">

        <img src="https://images.unsplash.com/photo-1571260899304-425eee4c7efc?auto=format&fit=crop&w=1000&q=80" alt="School activity">

        <img src="https://images.unsplash.com/photo-1587654780291-39c9404d746b?auto=format&fit=crop&w=1000&q=80" alt="Students">

    </div>

</section>

<footer>
    <p>&copy; 2026 SwiftSchool. All Rights Reserved.</p>
</footer>

</body>
</html>
